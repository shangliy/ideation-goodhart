[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ideagen"
version = "0.1.0"
description = "Generate testable research hypotheses by letting the model design and read experiments before it proposes"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["numpy"]

[project.scripts]
ideagen = "ideagen.cli:main"

[tool.setuptools]
packages = ["ideagen"]
